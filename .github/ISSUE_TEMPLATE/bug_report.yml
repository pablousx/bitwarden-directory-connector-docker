name: Bug report
description: Report a reproducible problem.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md instead of posting details here. Never attach real data.json files, organization API keys or directory secrets."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide a minimal example without credentials or private data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and logs
      description: Include Docker/Compose versions, image tag or digest, host architecture, provider and redacted logs. Remove user/group information and private domains.
