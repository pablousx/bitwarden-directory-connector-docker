name: Check official releases
on:
  schedule:
    - cron: '27 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-release-update
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Refresh official release lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_release.py
      # PRs created by GITHUB_TOKEN do not trigger pull_request workflows.
      # Validate the changed files here before opening the review request.
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/check_image.py
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/official-release
          commit-message: 'chore: update official Directory Connector release'
          title: 'chore: update official Directory Connector release'
          body: |
            Updates the official Linux CLI version and SHA-256 lock from GitHub release metadata.
            Runtime tests and an amd64 image build/smoke test ran in the update workflow before this PR.
            Review upstream release notes and configuration migrations before merging.
            GITHUB_TOKEN-created PRs do not trigger a separate pull_request CI run; see the update workflow run.
          add-paths: |
            release.json
            third_party/NOTICE
          delete-branch: true
