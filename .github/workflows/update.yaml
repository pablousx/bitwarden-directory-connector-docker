name: Check official releases
on:
  schedule:
    - cron: '27 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: official-release-update
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refresh official release lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_release.py
      # The bot PR's native pull_request workflow may require owner approval.
      # A workflow_dispatch run cannot satisfy the protected PR's required check.
      - name: Detect release changes
        id: changes
        run: |
          if git diff --quiet -- release.json third_party/NOTICE; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install repository test dependency
        if: steps.changes.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-yaml
      - run: python3 -m unittest discover -s tests -v
        if: steps.changes.outputs.changed == 'true'
      - name: Create or update the release PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/official-release
          commit-message: 'chore: update official Directory Connector release'
          title: 'chore: update official Directory Connector release'
          body: |
            Updates the official Linux CLI version and SHA-256 lock from GitHub release metadata.
            Approve the native pull_request workflow if GitHub requests approval; its required validate check builds and smoke-tests the candidate without publishing.
            Review upstream release notes and configuration migrations before merging.
            Wait for the native PR validate check to pass before merging. A manual workflow_dispatch run on this branch does not satisfy PR-required checks.
          add-paths: |
            release.json
            third_party/NOTICE
          delete-branch: true
