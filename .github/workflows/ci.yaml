name: Validate and publish
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/check_image.py
      - name: Validate Compose
        run: |
          mkdir -p secrets
          printf 'disposable\n' > secrets/client_id
          printf 'disposable\n' > secrets/client_secret
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.sync.yaml config --quiet
  publish:
    needs: validate
    if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Image tags
        id: tags
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          release = json.load(open('release.json'))
          version = f"{release['version']}-r{release['revision']}"
          if os.environ['REF'].startswith('refs/tags/') and os.environ['REF'] != f'refs/tags/v{version}':
              raise SystemExit('Git tag must match release.json: v' + version)
          image = 'ghcr.io/' + os.environ['REPOSITORY'].lower()
          tags = [image + ':' + version, image + ':sha-' + os.environ['SHA']]
          # Historical release tags must never roll latest backwards.
          if os.environ['REF'].startswith('refs/heads/'):
              tags.append(image + ':latest')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tags=' + ','.join(tags) + '\n')
          PY
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
