name: Validate and publish
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/check_image.py
      - name: Validate Compose
        run: |
          mkdir -p secrets
          printf 'disposable\n' > secrets/client_id
          printf 'disposable\n' > secrets/client_secret
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.sync.yaml config --quiet
  publish:
    needs: validate
    if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image tags
        id: tags
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          release = json.load(open('release.json'))
          version = f"{release['version']}-r{release['revision']}"
          if os.environ['REF'].startswith('refs/tags/') and os.environ['REF'] != f'refs/tags/v{version}':
              raise SystemExit('Git tag must match release.json: v' + version)
          image = 'ghcr.io/' + os.environ['REPOSITORY'].lower()
          tags = [image + ':' + version, image + ':sha-' + os.environ['SHA']]
          # Historical release tags must never roll latest backwards.
          if os.environ['REF'].startswith('refs/heads/'):
              tags.append(image + ':latest')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tags=' + ','.join(tags) + '\n')
          PY
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
