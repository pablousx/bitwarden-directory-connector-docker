name: Validate and publish
on:
  push:
  # Required PR checks must be produced by this native pull_request event.
  # workflow_dispatch on the same SHA does not satisfy PR-required checks.
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      image-digest: ${{ steps.build.outputs.digest }}
      archive-sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - name: Lint workflows with verified actionlint
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Install OCI copy tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the release artifact once
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/bwdc.oci.tar
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Test the exact OCI image
        id: archive
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          archive="$RUNNER_TEMP/bwdc.oci.tar"
          config_digest=$(python3 scripts/oci_archive.py "$archive" --digest "$IMAGE_DIGEST")
          skopeo --override-os linux --override-arch amd64 copy "oci-archive:$archive" docker-daemon:bwdc-ci:tested
          python3 scripts/check_image.py --image bwdc-ci:tested --config-digest "$config_digest"
          echo "sha256=$(sha256sum "$archive" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Validate Compose
        run: |
          mkdir -p secrets
          printf 'disposable\n' > secrets/client_id
          printf 'disposable\n' > secrets/client_secret
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.sync.yaml config --quiet
      - name: Upload only the tested image
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bwdc.oci.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
  publish:
    needs: validate
    if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: ghcr-publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the validated artifact by its immutable ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-id }}
          path: ${{ runner.temp }}/tested-image
          merge-multiple: true
          digest-mismatch: error
      - name: Install OCI copy tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested digest without rebuilding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IMAGE_DIGEST: ${{ needs.validate.outputs.image-digest }}
          ARCHIVE_SHA256: ${{ needs.validate.outputs.archive-sha256 }}
        run: python3 scripts/publish_image.py "$RUNNER_TEMP/tested-image/bwdc.oci.tar" --digest "$IMAGE_DIGEST" --sha256 "$ARCHIVE_SHA256"
